name: Перевірка оголошень

on:
  schedule:
    - cron: "*/20 * * * *"   # кожні 20 хвилин
  workflow_dispatch:          # кнопка ручного запуску

permissions:
  contents: write

concurrency:
  group: checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Перевірити AUTO.RIA
        env:
          RIA_API_KEY: ${{ secrets.RIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py
      - name: Зберегти бачені оголошення
        if: always()
        run: |
          git config user.name "avto-rozborka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "Оновити бачені оголошення" && git push)
