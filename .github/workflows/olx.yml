name: OLX з пошти

on:
  schedule:
    - cron: "7,27,47 * * * *"   # кожні 20 хвилин
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  olx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Перевірити листи OLX
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python olx_mail.py
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "avto-rozborka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add olx_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Оновити стан OLX" && git pull --rebase origin main && git push)
